# kind create cluster --config kind/cluster.yaml
# One node is enough for probes, self-healing, rollouts and the HPA. Envoy's Service is a
# NodePort pinned to 30080 (k8s/gateway.yaml), mapped here to http://localhost:8088
# (8088, so the cluster can run next to docker compose, which uses 8080).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: reel-history
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8088
        listenAddress: "127.0.0.1"
        protocol: TCP
