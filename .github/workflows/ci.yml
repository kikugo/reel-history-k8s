# Every PR to main (and every push to main): lint and tests, every Dockerfile builds, and the chart
# installs on a throwaway kind cluster where each service answers /healthz through the gateway.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - run: make helm-lint helm-template
      - name: terraform fmt and validate (no Azure login)
        run: |
          terraform -chdir=infra/aks fmt -check
          terraform -chdir=infra/aks init -backend=false -input=false
          terraform -chdir=infra/aks validate

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: recommender, context: services/recommender, file: services/recommender/Dockerfile}
          - {name: explainer, context: services/explainer, file: services/explainer/Dockerfile}
          - {name: frontend, context: services/frontend, file: services/frontend/Dockerfile}
          - {name: kserve-predictor, context: services, file: services/kserve-predictor/Dockerfile}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          tags: reel-history/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  kind-e2e:
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: kind cluster (same config as local)
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          config: kind/cluster.yaml
          cluster_name: reel-history
      - name: metrics-server, Envoy Gateway, GatewayClass
        run: make platform
      - name: build images and load them into kind
        run: make images TAG=dev
      - name: install the chart
        run: make helm-install TAG=dev
      - name: smoke test through the gateway
        run: scripts/ci_smoke.sh
      - name: diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n reel-history get events --sort-by=.lastTimestamp || true
          for p in $(kubectl -n reel-history get pods -o name); do
            echo "=== $p"; kubectl -n reel-history logs "$p" --all-containers --tail=50 || true
          done
