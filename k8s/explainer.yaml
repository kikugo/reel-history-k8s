# Explainer: asks the Phase 2 vLLM server on Modal, falls back to a template.
# The API key lives in the Secret "explainer-llm", created by `make secrets` from .env and
# never committed. It's optional: without it the explainer answers from the template.
apiVersion: v1
kind: ConfigMap
metadata:
  name: explainer
  namespace: reel-history
  labels:
    app.kubernetes.io/name: explainer
    app.kubernetes.io/part-of: reel-history
data:
  VLLM_BASE_URL: ""  # set to the deployed c2-vllm-awq URL to use the LLM
  LLM_MODEL: qwen3-8b-awq
  LLM_TIMEOUT_S: "15"
  LLM_DEADLINE_S: "30"
  LLM_RETRIES: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: explainer
  namespace: reel-history
  labels:
    app.kubernetes.io/name: explainer
    app.kubernetes.io/part-of: reel-history
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: explainer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: explainer
        app.kubernetes.io/part-of: reel-history
    spec:
      # keep replicas balanced across nodes; ScheduleAnyway so one-node kind still schedules them
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: explainer
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45  # an LLM call can take up to the 30 s deadline
      containers:
        - name: explainer
          image: reel-history/explainer:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef:
                name: explainer
            - secretRef:
                name: explainer-llm
                optional: true
          resources:
            requests: {cpu: 50m, memory: 128Mi}  # ~80 MiB measured
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Ready at start on purpose: the LLM scales to zero on Modal, and the template
          # answers while it wakes. Readiness tied to the LLM would empty the Service.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: explainer
  namespace: reel-history
  labels:
    app.kubernetes.io/name: explainer
    app.kubernetes.io/part-of: reel-history
spec:
  selector:
    app.kubernetes.io/name: explainer
  ports:
    - {name: http, port: 8000, targetPort: http}
