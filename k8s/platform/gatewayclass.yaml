# Cluster-scoped: tells Gateways named with class "eg" that Envoy Gateway implements them.
# Installed once per cluster with the platform, not with the app.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
