{{- /* Only rendered when a key is passed in (e.g. --set llmApiKey=... from CI secrets). */ -}}
{{- if .Values.llmApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.services.explainer.secretName }}
  labels:
    {{- include "rh.labels" (list $ "explainer") | nindent 4 }}
type: Opaque
stringData:
  VLLM_API_KEY: {{ .Values.llmApiKey | quote }}
{{- end }}
