{{- /* One ServiceMonitor per service; only when monitoring is on and the CRD exists. */ -}}
{{- if and .Values.monitoring.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
{{- range $name, $svc := .Values.services }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    {{- include "rh.labels" (list $ $name) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "rh.selector" (list $ $name) | nindent 6 }}
  endpoints:
    - port: {{ $svc.metricsPort }}
      path: /metrics
      interval: {{ $.Values.monitoring.interval }}
---
{{- end }}
{{- end }}
