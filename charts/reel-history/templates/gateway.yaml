{{- if .Values.gateway.enabled }}
{{- $g := .Values.gateway }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Release.Name }}-proxy
  labels:
    {{- include "rh.labels" (list $ "gateway") | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: {{ $g.serviceType }}
        {{- if eq $g.serviceType "NodePort" }}
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: {{ $g.nodePort }}
        {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "rh.labels" (list $ "gateway") | nindent 4 }}
spec:
  gatewayClassName: {{ $g.className }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ .Release.Name }}-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "rh.labels" (list $ "gateway") | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}
      sectionName: http
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api/rec/}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
      backendRefs:
        - {name: recommender, port: {{ .Values.services.recommender.port }}}
    - matches:
        - path: {type: PathPrefix, value: /api/explain/}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
      timeouts:
        request: {{ $g.explainTimeout }}
      backendRefs:
        - {name: explainer, port: {{ .Values.services.explainer.port }}}
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: frontend, port: {{ .Values.services.frontend.port }}}
{{- end }}
